[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-agent"
version = "0.2.0"
description = "Autonomous reinforcement-learning trading agent for Binance Futures"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
    "websockets>=12.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "torch>=2.0", "stable-baselines3>=2.2", "tensorboard>=2.15"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["agent_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
