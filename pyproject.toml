[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-agent"
version = "0.2.0"
description = "Autonomous reinforcement-learning trading agent for Binance Futures"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26,<3.0",
    "requests>=2.31,<3.0",
    "websockets>=12.0,<17.0",
    "python-dotenv>=1.0,<2.0",
    "gymnasium>=0.29,<1.3",
    "torch>=2.2",
    "stable-baselines3>=2.3,<3.0",
    "tensorboard>=2.16,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.5"]

[project.scripts]
trading-agent = "agent_system.main:main"

[tool.setuptools.packages.find]
include = ["agent_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
